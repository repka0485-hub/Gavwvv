name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    env:
      NDK: ${{ github.workspace }}/ndk
    steps:
      - uses: actions/checkout@v4

      - name: resolve ndk
        run: ln -s "${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" "$NDK"

      - name: build dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/Dobby
          # mach-o @PAGE/@PAGEOFF -> ELF :lo12: for android
          find /tmp/Dobby -name '*.asm' -path '*arm64*' -exec sed -i \
            -e 's/\([A-Za-z0-9_]\+\)@PAGEOFF/:lo12:\1/g' \
            -e 's/@PAGE\b//g' {} +
          cmake -S /tmp/Dobby -B /tmp/dobby-build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=OFF
          cmake --build /tmp/dobby-build -j$(nproc)
          mkdir -p dobby/arm64-v8a dobby/include
          cp "$(find /tmp/dobby-build -name 'libdobby.a' | head -n1)" dobby/arm64-v8a/
          cp /tmp/Dobby/include/dobby.h dobby/include/

      - name: build chams
        run: |
          cmake -S . -B out \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build out -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: libchams-arm64-v8a
          path: out/libchams.so

  menu-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check menu2
        run: ls -la menu2/jni

      - name: ndk-build
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          "$NDK/ndk-build" -j$(nproc) \
            NDK_PROJECT_PATH="$PWD/menu2" \
            APP_PLATFORM=android-26 APP_ABI=arm64-v8a \
            APP_BUILD_SCRIPT="$PWD/menu2/jni/Android.mk" \
            NDK_APPLICATION_MK="$PWD/menu2/jni/Application.mk"

      - uses: actions/upload-artifact@v4
        with:
          name: menu-arm64-v8a
          path: menu2/libs/arm64-v8a/menu
